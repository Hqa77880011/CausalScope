[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "causalscope"
version = "0.1.0"
description = "Workload-invariant root-cause localization for distributed AI training"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "torch>=2.6,<3",
  "matplotlib>=3.7,<4",
  "PyYAML>=6,<7",
  "psutil>=5.9,<8",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
workloads = ["torchvision>=0.21,<1", "transformers>=4.46,<5", "datasets>=3,<5", "nvidia-ml-py>=12,<14"]

[project.scripts]
causalscope = "causalscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
